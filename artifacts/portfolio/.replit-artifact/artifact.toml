kind = "web"
previewPath = "/"
title = "Rohith Vaddepally – Portfolio"
description = "A personal portfolio website for Rohith Vaddepally, a DevOps Engineer with 2.5 years of experience in cloud infrastructure, CI/CD, Kubernetes, and healthcare platforms. Showcases skills, work experience, domain expertise, and contact information."
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
